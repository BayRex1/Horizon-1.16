[mod]
id = "native_voice_lab"
version = "0.1.0"
priority = 100

[[injection]]
id = "list"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
kind = "HEAD"
helper = "list.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "services"
target = "horizon_client::game::native_hooks::Game<'_>::native_voice_mods"
kind = "HEAD"
helper = "services.rs"
bindings = [{ name = "mods", ty = "&mut Vec<horizon_mods::native::Declaration>", value = "&mut *mods" }]

[[injection]]
id = "key"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
kind = "HEAD"
helper = "key.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }, { name = "key", ty = "&str", value = "key" }, { name = "pressed", ty = "bool", value = "pressed" }]

[[injection]]
id = "frame"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "command"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
kind = "HEAD"
helper = "command.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }, { name = "command", ty = "&str", value = "command" }, { name = "ran", ty = "&mut bool", value = "&mut *ran" }]
