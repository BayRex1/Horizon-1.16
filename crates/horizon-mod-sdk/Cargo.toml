[package]
name = "horizon-mod-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Write Horizon mods in Rust: WebAssembly components for the horizon:mod world (docs/mods.md)"

[dependencies]
wit-bindgen = { version = "0.60.0", default-features = false, features = ["macros", "realloc"] }

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
horizon-mods = { path = "../horizon-mods", default-features = false, optional = true }

[features]
# Typed native services; mixin helpers can use the game's horizon_mods dependency directly.
native = ["dep:horizon-mods"]
